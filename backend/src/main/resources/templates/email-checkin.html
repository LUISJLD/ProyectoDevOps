<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Check-in Exitoso</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 30px auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header { background-color: #10b981; color: #ffffff; padding: 25px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 600; }
        .content { padding: 30px; color: #333333; line-height: 1.6; }
        .content h2 { color: #10b981; font-size: 20px; margin-top: 0; }
        .details { background-color: #f8fafc; border-left: 4px solid #10b981; padding: 15px; margin: 20px 0; border-radius: 4px; }
        .details p { margin: 5px 0; font-size: 15px; }
        .footer { background-color: #f1f5f9; padding: 20px; text-align: center; color: #64748b; font-size: 13px; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>¡Check-in Registrado!</h1>
        </div>
        <div class="content">
            <h2 th:text="'Hola, ' + ${nombre}">Hola, Usuario</h2>
            <p>Tu asistencia al evento <strong th:text="${eventoNombre}">Nombre del Evento</strong> ha sido registrada con éxito en nuestro sistema.</p>
            
            <div class="details">
                <p><strong>📅 Fecha del registro:</strong> <span th:text="${fecha}">01/01/2026</span></p>
                <p><strong>⏰ Hora de acceso:</strong> <span th:text="${hora}">10:00</span></p>
            </div>
            
            <p>¡Esperamos que disfrutes mucho del evento!</p>
        </div>
        <div class="footer">
            <p>Sistema de Gestión de Eventos &copy; 2026</p>
        </div>
    </div>
</body>
</html>
